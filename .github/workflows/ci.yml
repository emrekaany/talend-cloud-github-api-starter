name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy src

      - name: Test
        run: >-
          python -m pytest
          --cov=talend_api_starter
          --cov-report=term-missing
          --cov-fail-under=100

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip "build>=1,<2" "twine>=7,<8"
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/talend-api --version
          wheel-smoke/bin/talend-api --help
          wheel-smoke/bin/talend-api demo --output-dir wheel-demo
          test -s wheel-demo/local_view.json
          test -s wheel-demo/share_safe.json
          wheel-smoke/bin/python -m json.tool wheel-demo/local_view.json > /dev/null
          wheel-smoke/bin/python -m json.tool wheel-demo/share_safe.json > /dev/null

  minimum-dependencies:
    name: Minimum direct dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install minimum direct runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "defusedxml==0.7.1" \
            "httpx==0.27.0" \
            "pytest==8.0.0" \
            "pytest-cov==5.0.0" \
            "typer==0.16.1"
          python -m pip install --no-deps .
          python -m pip check

      - name: Test minimum dependency contract
        run: >-
          python -m pytest
          --cov=talend_api_starter
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100

      - name: Smoke-test installed minimum dependency contract
        run: |
          talend-api --version
          talend-api --help
          talend-api demo --output-dir minimum-demo
          talend-api local jobs examples \
            --path-prefix fixtures \
            --output-dir minimum-local-output
          test -s minimum-demo/local_view.json
          test -s minimum-demo/share_safe.json
          test -s minimum-local-output/local_view.json
          test -s minimum-local-output/share_safe.json
          python -m json.tool minimum-demo/share_safe.json > /dev/null
          python -m json.tool minimum-local-output/share_safe.json > /dev/null

  windows-smoke:
    name: Windows ${{ matrix.python-version }} smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Run offline demo
        run: talend-api demo --output-dir windows-demo
