<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Independent Talend engineering toolkit</title>
  <desc id="desc">A free public read-only Talend API and GitHub API CLI leads to three separately scoped private products: Assistant for Talend, Column Diagnostics, and Talend Commit Diff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="0.55" stop-color="#0a2131"/><stop offset="1" stop-color="#102b3d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#020617" flood-opacity=".44"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d8f3ff" stroke-opacity=".04"/></pattern>
    <style>.eyebrow{font:760 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:3px}.headline{font:800 66px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-1.7px}.title{font:770 31px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:560 25px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.small{font:650 19px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font:650 17px ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect width="1600" height="900" rx="36" fill="url(#grid)"/><circle cx="1510" cy="-20" r="390" fill="#2563eb" opacity=".09"/><circle cx="30" cy="890" r="350" fill="#14b8a6" opacity=".09"/>
  <g transform="translate(82 84)">
    <text class="eyebrow" fill="#8ce8dc">FREE CLI · PRIVATE ENGINEERING PRODUCTS</text>
    <text y="82" class="headline" fill="#f8fafc">Independent Talend</text><text y="160" class="headline" fill="#f8fafc">engineering toolkit</text>
    <text y="220" class="body" fill="#c7dce3">Inspect safely for free.</text><text y="258" class="body" fill="#c7dce3">Diagnose deeply in a private, approved scope.</text>
    <g transform="translate(0 308)" filter="url(#shadow)">
      <rect width="616" height="258" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity=".5" stroke-width="2"/>
      <rect x="28" y="26" width="205" height="38" rx="19" fill="#5eead4" fill-opacity=".13"/><text x="130" y="52" text-anchor="middle" class="eyebrow" fill="#8ce8dc">FREE · PUBLIC</text>
      <text x="28" y="120" class="title" fill="#f8fafc">Talend API + GitHub API CLI</text>
      <text x="28" y="164" class="body" fill="#c7dce3">Read metadata. Never run a job.</text>
      <rect x="28" y="194" width="560" height="40" rx="20" fill="#071722"/><text x="308" y="220" text-anchor="middle" class="mono" fill="#8ce8dc">SYNTHETIC · LOCAL · PUBLIC GITHUB · API GET</text>
    </g>
  </g>

  <path d="M760 460h76" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/><path d="M854 460l-24-15v30z" fill="#70cbd5"/>

  <g transform="translate(880 106)">
    <text class="eyebrow" fill="#9bc7ff">SEPARATELY SCOPED · PRIVATE</text>
    <g transform="translate(0 46)" filter="url(#shadow)"><rect width="638" height="190" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity=".5" stroke-width="2"/><rect x="28" y="24" width="178" height="36" rx="18" fill="#60a5fa" fill-opacity=".14"/><text x="117" y="49" text-anchor="middle" class="eyebrow" fill="#9bc7ff">FLAGSHIP</text><text x="28" y="112" class="title" fill="#f8fafc">Assistant for Talend</text><text x="28" y="152" class="body" fill="#c9dbec">Job families → evidence → guidance → validation</text></g>
    <g transform="translate(0 266)" filter="url(#shadow)"><rect width="638" height="172" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity=".46" stroke-width="2"/><text x="28" y="64" class="title" fill="#f8fafc">Column Diagnostics</text><text x="28" y="106" class="body" fill="#c7dce3">Talend ↔ Oracle compatibility</text><text x="28" y="140" class="mono" fill="#8ce8dc">TYPE · SIZE · SCALE · NULLABILITY · TRUNCATION</text></g>
    <g transform="translate(0 468)" filter="url(#shadow)"><rect width="638" height="172" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity=".46" stroke-width="2"/><text x="28" y="64" class="title" fill="#f8fafc">Talend Commit Diff</text><text x="28" y="106" class="body" fill="#c9dbec">Semantic change review</text><text x="28" y="140" class="mono" fill="#9bc7ff">REAL CHANGE · RISK SIGNALS · REGRESSION PLAN</text></g>
  </g>

  <g transform="translate(210 792)"><rect width="1180" height="62" rx="31" fill="#06131f" fill-opacity=".9" stroke="#d8f3ff" stroke-opacity=".15"/><text x="590" y="40" text-anchor="middle" class="small" fill="#d7e9ee">CUSTOMER-AUTHORIZED · PRIVATE SOURCE · AGREED ARCHITECTURE · NO PUBLIC UPLOAD</text></g>
</svg>
