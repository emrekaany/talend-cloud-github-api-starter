<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1340" viewBox="0 0 1000 1340" role="img" aria-labelledby="title desc">
  <title id="title">Assistant for Talend evidence workflow</title>
  <desc id="desc">Customer-authorized Talend artifacts and optional runtime logs flow through job-family discovery and evidence-based ETL, SQL, runtime, and risk analysis into reviewable guidance and reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.43"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d8f3ff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .eyebrow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; font-weight: 760; letter-spacing: 2.3px; }
      .headline { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 43px; font-weight: 790; letter-spacing: -0.7px; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 31px; font-weight: 770; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 23px; font-weight: 560; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; font-weight: 620; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 650; }
      .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 28px; font-weight: 780; }
    </style>
  </defs>

  <rect width="1000" height="1340" rx="34" fill="url(#bg)"/>
  <rect width="1000" height="1340" rx="34" fill="url(#grid)"/>
  <circle cx="930" cy="10" r="260" fill="#2563eb" opacity="0.1"/>
  <circle cx="40" cy="1320" r="270" fill="#14b8a6" opacity="0.1"/>

  <text x="500" y="58" text-anchor="middle" class="eyebrow" fill="#9bc7ff">ASSISTANT FOR TALEND · FLAGSHIP PRIVATE PRODUCT</text>
  <text x="500" y="112" text-anchor="middle" class="headline" fill="#f8fafc">From Talend jobs to action</text>

  <g transform="translate(60 158)" filter="url(#shadow)">
    <rect width="880" height="220" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity="0.46" stroke-width="2"/>
    <circle cx="64" cy="62" r="32" fill="#5eead4" fill-opacity="0.14"/>
    <text x="64" y="72" text-anchor="middle" class="num" fill="#8ce8dc">01</text>
    <text x="116" y="54" class="eyebrow" fill="#8ce8dc">CUSTOMER-AUTHORIZED INPUT</text>
    <text x="116" y="96" class="title" fill="#f8fafc">Talend artifacts + optional logs</text>
    <text x="34" y="146" class="body" fill="#c7dce3">.item · .properties · HTML/ZIP · runtime/error logs</text>
    <rect x="34" y="170" width="812" height="30" rx="15" fill="#071722"/>
    <text x="440" y="191" text-anchor="middle" class="mono" fill="#8ce8dc">BOUNDED · PRIVATE · SEPARATELY SCOPED</text>
  </g>

  <path d="M500 393v27" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 435l-12-18h24z" fill="#70cbd5"/>

  <g transform="translate(60 448)" filter="url(#shadow)">
    <rect width="880" height="220" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity="0.48" stroke-width="2"/>
    <circle cx="64" cy="62" r="32" fill="#60a5fa" fill-opacity="0.15"/>
    <text x="64" y="72" text-anchor="middle" class="num" fill="#9bc7ff">02</text>
    <text x="116" y="54" class="eyebrow" fill="#9bc7ff">DISCOVER THE REAL SCOPE</text>
    <text x="116" y="96" class="title" fill="#f8fafc">Root Job + transitive tRunJob family</text>
    <text x="34" y="146" class="body" fill="#c9dbec">Repository → project → selected root → resolvable children</text>
    <rect x="34" y="170" width="812" height="30" rx="15" fill="#081828"/>
    <text x="440" y="191" text-anchor="middle" class="mono" fill="#9bc7ff">EXACT ARTIFACT · REVALIDATED BEFORE ANALYSIS</text>
  </g>

  <path d="M500 683v27" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 725l-12-18h24z" fill="#70cbd5"/>

  <g transform="translate(60 738)" filter="url(#shadow)">
    <rect width="880" height="220" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity="0.48" stroke-width="2"/>
    <circle cx="64" cy="62" r="32" fill="#60a5fa" fill-opacity="0.15"/>
    <text x="64" y="72" text-anchor="middle" class="num" fill="#9bc7ff">03</text>
    <text x="116" y="54" class="eyebrow" fill="#9bc7ff">CORRELATE THE EVIDENCE</text>
    <text x="116" y="96" class="title" fill="#f8fafc">ETL · SQL · runtime · risk</text>
    <text x="34" y="146" class="body" fill="#c9dbec">Schema · tMap · batching · retry · CDC · critical path</text>
    <rect x="34" y="170" width="812" height="30" rx="15" fill="#081828"/>
    <text x="440" y="191" text-anchor="middle" class="mono" fill="#9bc7ff">MISSING EVIDENCE STAYS UNKNOWN</text>
  </g>

  <path d="M500 973v27" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 1015l-12-18h24z" fill="#70cbd5"/>

  <g transform="translate(60 1028)" filter="url(#shadow)">
    <rect width="880" height="220" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity="0.46" stroke-width="2"/>
    <circle cx="64" cy="62" r="32" fill="#5eead4" fill-opacity="0.14"/>
    <text x="64" y="72" text-anchor="middle" class="num" fill="#8ce8dc">04</text>
    <text x="116" y="54" class="eyebrow" fill="#8ce8dc">MAKE THE REVIEW ACTIONABLE</text>
    <text x="116" y="96" class="title" fill="#f8fafc">Location · evidence · guidance · validation</text>
    <text x="34" y="146" class="body" fill="#c7dce3">Prioritized findings with confidence, effort, and change risk</text>
    <rect x="34" y="170" width="812" height="30" rx="15" fill="#071722"/>
    <text x="440" y="191" text-anchor="middle" class="mono" fill="#8ce8dc">MARKDOWN · HTML · JSON · PDF</text>
  </g>

  <g transform="translate(110 1272)">
    <rect width="780" height="42" rx="21" fill="#06131f" fill-opacity="0.9" stroke="#d8f3ff" stroke-opacity="0.15"/>
    <text x="390" y="28" text-anchor="middle" class="mono" fill="#d7e9ee">Deterministic local rules available · AI layer is optional</text>
  </g>
</svg>
