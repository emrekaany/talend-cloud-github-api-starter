<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Three private Talend engineering products</title>
  <desc id="desc">Assistant for Talend traces Job families and turns evidence into action. Column Diagnostics finds Talend and Oracle schema compatibility risk. Talend Commit Diff finds semantic change and focuses regression testing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#102b3d"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#020617" flood-opacity=".42"/></filter><style>.eyebrow{font:760 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.4px}.headline{font:790 40px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{font:770 27px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:560 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font:650 15px ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" class="eyebrow" fill="#8ce8dc">PRIVATE TALEND ENGINEERING · THREE DECISIONS</text><text x="600" y="104" text-anchor="middle" class="headline" fill="#f8fafc">Find the scope. Find the mismatch. Find the change.</text>
  <g transform="translate(44 144)">
    <g filter="url(#shadow)"><rect width="350" height="326" rx="26" fill="#102a42" stroke="#60a5fa" stroke-opacity=".5" stroke-width="2"/><circle cx="48" cy="48" r="24" fill="#60a5fa" fill-opacity=".15"/><path d="M38 48h20M48 38v20" stroke="#9bc7ff" stroke-width="4" stroke-linecap="round"/><text x="28" y="112" class="eyebrow" fill="#9bc7ff">FLAGSHIP</text><text x="28" y="153" class="title" fill="#f8fafc">Assistant for Talend</text><text x="28" y="196" class="body" fill="#c9dbec">Trace the root Job and its</text><text x="28" y="225" class="body" fill="#c9dbec">resolvable tRunJob family.</text><rect x="28" y="254" width="294" height="44" rx="14" fill="#081828"/><text x="175" y="282" text-anchor="middle" class="mono" fill="#9bc7ff">EVIDENCE → ACTION</text></g>
    <g transform="translate(381)" filter="url(#shadow)"><rect width="350" height="326" rx="26" fill="#0e2a3a" stroke="#5eead4" stroke-opacity=".5" stroke-width="2"/><circle cx="48" cy="48" r="24" fill="#5eead4" fill-opacity=".14"/><path d="M35 42h26M35 52h18M35 62h22" stroke="#8ce8dc" stroke-width="4" stroke-linecap="round"/><text x="28" y="112" class="eyebrow" fill="#8ce8dc">BEFORE RELEASE</text><text x="28" y="153" class="title" fill="#f8fafc">Column Diagnostics</text><text x="28" y="196" class="body" fill="#c7dce3">Catch type, length, scale,</text><text x="28" y="225" class="body" fill="#c7dce3">nullability, truncation risk.</text><rect x="28" y="254" width="294" height="44" rx="14" fill="#071722"/><text x="175" y="282" text-anchor="middle" class="mono" fill="#8ce8dc">TALEND ↔ ORACLE</text></g>
    <g transform="translate(762)" filter="url(#shadow)"><rect width="350" height="326" rx="26" fill="#102a42" stroke="#60a5fa" stroke-opacity=".5" stroke-width="2"/><circle cx="48" cy="48" r="24" fill="#60a5fa" fill-opacity=".15"/><path d="M36 42h24M36 54h16M36 66h28" stroke="#9bc7ff" stroke-width="4" stroke-linecap="round"/><text x="28" y="112" class="eyebrow" fill="#9bc7ff">BETWEEN COMMITS</text><text x="28" y="153" class="title" fill="#f8fafc">Talend Commit Diff</text><text x="28" y="196" class="body" fill="#c9dbec">Filter serialization noise.</text><text x="28" y="225" class="body" fill="#c9dbec">Focus tests on real risk.</text><rect x="28" y="254" width="294" height="44" rx="14" fill="#081828"/><text x="175" y="282" text-anchor="middle" class="mono" fill="#9bc7ff">SEMANTIC REVIEW</text></g>
  </g>
  <text x="600" y="518" text-anchor="middle" class="mono" fill="#d7e9ee">SEPARATE SCOPE · PRIVATE EVIDENCE · REVIEWABLE OUTPUT</text>
</svg>
