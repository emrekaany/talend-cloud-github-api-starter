<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Talend private-product finding</title>
  <desc id="desc">A synthetic high-risk Talend-to-Oracle compatibility finding shows the exact Job and component, source and target column evidence, a potential truncation risk, recommended change, and validation plan.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131f"/><stop offset="1" stop-color="#102b3d"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".44"/></filter><style>.eyebrow{font:760 17px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.4px}.headline{font:790 38px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.title{font:770 25px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:560 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.small{font:650 18px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font:650 16px ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" class="eyebrow" fill="#8ce8dc">SYNTHETIC SAMPLE · WHAT PRIVATE EVIDENCE LOOKS LIKE</text>
  <g transform="translate(54 88)" filter="url(#shadow)"><rect width="1092" height="450" rx="28" fill="#0d2232" stroke="#f87171" stroke-opacity=".45" stroke-width="2"/>
    <g transform="translate(28 26)"><rect width="146" height="38" rx="19" fill="#f87171" fill-opacity=".14"/><text x="73" y="26" text-anchor="middle" class="eyebrow" fill="#fca5a5">HIGH RISK</text><text x="0" y="104" class="headline" fill="#f8fafc">Potential truncation before deployment</text><text x="0" y="142" class="body" fill="#cbd5e1">Exact location · evidence · recommendation · validation</text></g>
    <g transform="translate(28 198)"><rect width="502" height="100" rx="20" fill="#071722" stroke="#5eead4" stroke-opacity=".22"/><text x="24" y="34" class="eyebrow" fill="#8ce8dc">TALEND SOURCE · OUT</text><text x="24" y="70" class="title" fill="#f8fafc">customer_name · String(120)</text>
      <rect x="534" width="502" height="100" rx="20" fill="#071722" stroke="#60a5fa" stroke-opacity=".22"/><text x="558" y="34" class="eyebrow" fill="#9bc7ff">ORACLE TARGET · IN</text><text x="558" y="70" class="title" fill="#f8fafc">CUSTOMER_NAME · VARCHAR2(80)</text></g>
    <path d="M520 348h160" stroke="#f87171" stroke-width="5" stroke-linecap="round"/><path d="M692 348l-18-12v24z" fill="#f87171"/>
    <g transform="translate(28 326)"><rect width="322" height="92" rx="19" fill="#102a42"/><text x="20" y="31" class="eyebrow" fill="#9bc7ff">EXACT LOCATION</text><text x="20" y="63" class="mono" fill="#dbeafe">OrdersJob / tOracleOutput_1</text></g>
    <g transform="translate(385 326)"><rect width="322" height="92" rx="19" fill="#102a42"/><text x="20" y="31" class="eyebrow" fill="#9bc7ff">RECOMMENDATION</text><text x="20" y="63" class="mono" fill="#dbeafe">align or validate length</text></g>
    <g transform="translate(742 326)"><rect width="322" height="92" rx="19" fill="#0e2a3a"/><text x="20" y="31" class="eyebrow" fill="#8ce8dc">VALIDATION</text><text x="20" y="63" class="mono" fill="#d1fae5">boundary + regression tests</text></g>
  </g>
  <rect x="210" y="560" width="780" height="34" rx="17" fill="#06131f" stroke="#d8f3ff" stroke-opacity=".14"/><text x="600" y="583" text-anchor="middle" class="mono" fill="#d7e9ee">FICTIONAL IDENTIFIERS · NO CUSTOMER DATA · HUMAN REVIEW REQUIRED</text>
</svg>
