<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="title desc">
  <title id="title">Talend Commit Diff</title>
  <desc id="desc">A synthetic, vertically structured product card shows two immutable Talend commits flowing through a semantic comparison that filters known serialization noise and produces reviewable change and risk signals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="1" stop-color="#102f4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d8f3ff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <style>
      .eyebrow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 23px; font-weight: 760; letter-spacing: 3px; }
      .headline { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 53px; font-weight: 800; letter-spacing: -1px; }
      .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 29px; font-weight: 520; }
      .section { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 27px; font-weight: 760; letter-spacing: 1.2px; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 28px; font-weight: 560; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 24px; font-weight: 580; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 25px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1000" height="1240" rx="34" fill="url(#background)"/>
  <rect width="1000" height="1240" rx="34" fill="url(#grid)"/>
  <circle cx="950" cy="5" r="250" fill="#2563eb" opacity="0.12"/>
  <circle cx="35" cy="1220" r="250" fill="#6366f1" opacity="0.08"/>

  <text x="500" y="66" text-anchor="middle" class="eyebrow" fill="#abc5df">PRIVATE TALEND ENGINEERING · SYNTHETIC</text>
  <text x="500" y="137" text-anchor="middle" class="headline" fill="#f8fafc">Talend Commit Diff</text>
  <text x="500" y="184" text-anchor="middle" class="subtitle" fill="#c9dbec">Review semantic changes before release.</text>

  <g transform="translate(54 226)" filter="url(#shadow)">
    <rect width="892" height="292" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity="0.46" stroke-width="2"/>
    <text x="446" y="48" text-anchor="middle" class="eyebrow" fill="#9bc7ff">TWO IMMUTABLE COMMITS</text>

    <g transform="translate(32 78)">
      <rect width="286" height="126" rx="23" fill="#081828" stroke="#60a5fa" stroke-opacity="0.3"/>
      <text x="143" y="41" text-anchor="middle" class="section" fill="#9bc7ff">COMMIT A</text>
      <text x="143" y="84" text-anchor="middle" class="mono" fill="#e5eef8">a1b2c3d</text>
      <text x="143" y="113" text-anchor="middle" class="small" fill="#9fbcc7">baseline</text>
    </g>

    <path d="M340 142H552" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <path d="m538 129 18 13-18 13" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="361" y="106" width="170" height="70" rx="22" fill="#173858" stroke="url(#accent)" stroke-width="2"/>
    <text x="446" y="136" text-anchor="middle" class="small" fill="#abc9e7">SEMANTIC</text>
    <text x="446" y="164" text-anchor="middle" class="section" fill="#f8fafc">DIFF</text>

    <g transform="translate(574 78)">
      <rect width="286" height="126" rx="23" fill="#081828" stroke="#60a5fa" stroke-opacity="0.3"/>
      <text x="143" y="41" text-anchor="middle" class="section" fill="#9bc7ff">COMMIT B</text>
      <text x="143" y="84" text-anchor="middle" class="mono" fill="#e5eef8">e4f5a6b</text>
      <text x="143" y="113" text-anchor="middle" class="small" fill="#9fbcc7">target</text>
    </g>

    <rect x="176" y="225" width="540" height="42" rx="21" fill="#60a5fa" fill-opacity="0.12"/>
    <text x="446" y="254" text-anchor="middle" class="small" fill="#9bc7ff">Known Talend serialization noise filtered</text>
  </g>

  <g transform="translate(54 548)" filter="url(#shadow)">
    <rect width="892" height="286" rx="28" fill="#0b2034" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="2"/>
    <text x="32" y="50" class="eyebrow" fill="#9bc7ff">REVIEWABLE CHANGE SIGNALS</text>

    <g transform="translate(30 82)">
      <rect width="832" height="60" rx="20" fill="#071725" stroke="#60a5fa" stroke-opacity="0.22"/>
      <text x="26" y="40" class="body" fill="#e5eef8">Components · parameters · connections</text>
    </g>
    <g transform="translate(30 154)">
      <rect width="832" height="60" rx="20" fill="#071725" stroke="#60a5fa" stroke-opacity="0.22"/>
      <text x="26" y="40" class="body" fill="#e5eef8">Added / removed nodes · rename / move</text>
    </g>
    <g transform="translate(30 226)">
      <rect width="832" height="38" rx="19" fill="#071725" stroke="#60a5fa" stroke-opacity="0.22"/>
      <text x="416" y="28" text-anchor="middle" class="small" fill="#abc9e7">Repeated patterns across Job folders</text>
    </g>
  </g>

  <g transform="translate(54 864)" filter="url(#shadow)">
    <rect width="892" height="184" rx="28" fill="#102a42" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="2"/>
    <text x="32" y="48" class="eyebrow" fill="#9bc7ff">DETERMINISTIC REVIEW</text>
    <text x="32" y="93" class="body" fill="#e5eef8">Risk signals · recommendations</text>
    <text x="32" y="137" class="body" fill="#e5eef8">Regression test plan</text>
  </g>

  <g transform="translate(54 1074)">
    <rect width="892" height="80" rx="24" fill="#071725" stroke="#60a5fa" stroke-opacity="0.26"/>
    <text x="446" y="34" text-anchor="middle" class="small" fill="#9bc7ff">Recognized secret fields masked</text>
    <text x="446" y="64" text-anchor="middle" class="small" fill="#e5eef8">Review output before sharing</text>
  </g>

  <g transform="translate(98 1168)">
    <rect width="804" height="56" rx="24" fill="#06131f" fill-opacity="0.9" stroke="#60a5fa" stroke-opacity="0.25"/>
    <text x="402" y="24" text-anchor="middle" class="small" fill="#9bc7ff">166 LOCALLY VERIFIED TESTS · AI OPTIONAL</text>
    <text x="402" y="47" text-anchor="middle" class="small" fill="#e5eef8">WORKING TREE UNCHANGED</text>
  </g>
</svg>
