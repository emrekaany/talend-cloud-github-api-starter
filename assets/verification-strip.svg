<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Verified engineering evidence</title>
  <desc id="desc">The current source passed 254 credential-free tests plus one expected macOS filesystem skip, reached 100 percent statement and branch coverage, and is tested on Linux and Windows with Python 3.10 through 3.14.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#102b3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d8f3ff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .eyebrow { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 760; letter-spacing: 3px; }
      .number { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 82px; font-weight: 800; letter-spacing: -2px; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 29px; font-weight: 700; }
      .body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 560; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="34" fill="url(#grid)"/>
  <text x="700" y="62" text-anchor="middle" class="eyebrow" fill="#a5c1ca">CURRENT SOURCE · CREDENTIAL-FREE QUALITY GATES</text>

  <g transform="translate(68 106)" filter="url(#shadow)">
    <rect width="396" height="300" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity="0.4" stroke-width="2"/>
    <text x="198" y="103" text-anchor="middle" class="number" fill="#74eadb">254</text>
    <text x="198" y="151" text-anchor="middle" class="label" fill="#f8fafc">tests passed</text>
    <line x1="50" y1="190" x2="346" y2="190" stroke="#d8f3ff" stroke-opacity="0.13"/>
    <text x="198" y="231" text-anchor="middle" class="body" fill="#b9d2db">+1 expected macOS skip</text>
    <text x="198" y="267" text-anchor="middle" class="mono" fill="#8ce8dc">NO PROVIDER CREDENTIALS</text>
  </g>

  <g transform="translate(502 106)" filter="url(#shadow)">
    <rect width="396" height="300" rx="28" fill="#102a42" stroke="#60a5fa" stroke-opacity="0.42" stroke-width="2"/>
    <text x="198" y="103" text-anchor="middle" class="number" fill="#82b9fb">100%</text>
    <text x="198" y="151" text-anchor="middle" class="label" fill="#f8fafc">coverage</text>
    <line x1="50" y1="190" x2="346" y2="190" stroke="#d8f3ff" stroke-opacity="0.13"/>
    <text x="198" y="231" text-anchor="middle" class="body" fill="#c1d7ea">statements + branches</text>
    <text x="198" y="267" text-anchor="middle" class="mono" fill="#9bc7ff">ENFORCED IN CI</text>
  </g>

  <g transform="translate(936 106)" filter="url(#shadow)">
    <rect width="396" height="300" rx="28" fill="#0e2a3a" stroke="#5eead4" stroke-opacity="0.4" stroke-width="2"/>
    <text x="198" y="103" text-anchor="middle" class="number" fill="#74eadb">3.10–3.14</text>
    <text x="198" y="151" text-anchor="middle" class="label" fill="#f8fafc">Python</text>
    <line x1="50" y1="190" x2="346" y2="190" stroke="#d8f3ff" stroke-opacity="0.13"/>
    <text x="198" y="231" text-anchor="middle" class="body" fill="#b9d2db">Linux + Windows</text>
    <text x="198" y="267" text-anchor="middle" class="mono" fill="#8ce8dc">PACKAGE + SMOKE GATES</text>
  </g>

  <g transform="translate(330 448)">
    <rect width="740" height="42" rx="21" fill="#06131f" fill-opacity="0.85" stroke="#d8f3ff" stroke-opacity="0.14"/>
    <text x="370" y="28" text-anchor="middle" class="mono" fill="#d7e9ee">No live Talend tenant or entitlement was used.</text>
  </g>
</svg>
