[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "talend-api-github-cli"
dynamic = ["version"]
description = "A safe, read-only CLI for Talend APIs and Talend Studio metadata from local projects or public GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Kaan Yılmaz" }]
keywords = ["talend", "talend-api", "github-api", "cli", "data-engineering", "etl", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "typer>=0.16.1,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
]

[project.urls]
Homepage = "https://github.com/emrekaany/talend-cloud-github-api-starter"
Repository = "https://github.com/emrekaany/talend-cloud-github-api-starter"
Issues = "https://github.com/emrekaany/talend-cloud-github-api-starter/issues"
Documentation = "https://github.com/emrekaany/talend-cloud-github-api-starter#readme"
Changelog = "https://github.com/emrekaany/talend-cloud-github-api-starter/blob/main/CHANGELOG.md"

[project.scripts]
talend-api = "talend_api_starter.cli:app"
talend-api-starter = "talend_api_starter.cli:app"

[tool.hatch.version]
path = "src/talend_api_starter/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/talend_api_starter"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["talend_api_starter"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
