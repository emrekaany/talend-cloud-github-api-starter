[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "talend-cloud-github-api-starter"
version = "0.1.0"
description = "A safe, read-only starter for Talend Cloud and public GitHub Talend job inventory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Kaan Yılmaz" }]
keywords = ["talend", "github-api", "data-engineering", "etl", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "mypy>=1.14,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/emrekaany/talend-cloud-github-api-starter"
Repository = "https://github.com/emrekaany/talend-cloud-github-api-starter"
Issues = "https://github.com/emrekaany/talend-cloud-github-api-starter/issues"
Documentation = "https://github.com/emrekaany/talend-cloud-github-api-starter#readme"

[project.scripts]
talend-api-starter = "talend_api_starter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/talend_api_starter"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["talend_api_starter"]

[tool.coverage.report]
fail_under = 90
show_missing = true
